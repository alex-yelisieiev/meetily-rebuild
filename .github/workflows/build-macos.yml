name: Build Meetily (macOS)

# Builds the native SwiftUI app with the Rust engine embedded, packs it into a DMG
# and publishes it as a GitHub Release (tag build-<run number>).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Cache FFmpeg sidecar
        uses: actions/cache@v6
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*
          key: ffmpeg-${{ hashFiles('frontend/src-tauri/build/ffmpeg.rs') }}

      # llama.cpp's bundled HTTP client doesn't compile against OpenSSL 4 yet.
      - name: Use OpenSSL 3
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar
        run: |
          # Separate target dir: Tauri later copies the sidecar to target/release/llama-helper itself.
          cargo build --release -p llama-helper --features metal --target-dir target/sidecar
          mkdir -p frontend/src-tauri/binaries
          cp target/sidecar/release/llama-helper "frontend/src-tauri/binaries/llama-helper-$(rustc -vV | awk '/host:/{print $2}')"

      - name: Build engine
        working-directory: frontend
        run: pnpm tauri build --bundles app

      - name: Build native app
        working-directory: native
        run: ./build-app.sh

      - name: Package DMG
        working-directory: native/build
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Meetily.app/Contents/Info.plist)
          DMG="Meetily-$VERSION-arm64.dmg"
          mkdir dmg
          cp -R Meetily.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Meetily" -srcfolder dmg -fs HFS+ -format UDZO -ov "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish release
        working-directory: native/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "$DMG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Meetily $VERSION (build ${{ github.run_number }})" \
            --notes "Automated build of ${{ github.sha }}. Apple Silicon only. Not signed or notarized: the first time, right-click Meetily and choose Open." \
            --latest
