name: Build Meetily (macOS)

# Builds the native SwiftUI app with the Rust engine embedded and uploads Meetily.app as a zip.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Cache FFmpeg sidecar
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*
          key: ffmpeg-${{ hashFiles('frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar
        run: |
          cargo build --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper "frontend/src-tauri/binaries/llama-helper-$(rustc -vV | awk '/host:/{print $2}')"

      - name: Build engine
        working-directory: frontend
        run: pnpm tauri build --bundles app

      - name: Build native app
        working-directory: native
        run: ./build-app.sh

      - name: Package
        working-directory: native/build
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Meetily.app/Contents/Info.plist)
          ditto -c -k --keepParent Meetily.app "Meetily-$VERSION-arm64.zip"
          echo "ZIP=Meetily-$VERSION-arm64.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Meetily-macOS-arm64
          path: native/build/${{ env.ZIP }}
          if-no-files-found: error
